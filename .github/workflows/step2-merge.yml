name: Review Merge (Step 2)

on:
  workflow_dispatch:   # Manual trigger only - no schedule, since this requires
                        # you to have already filled in the Decision column first

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run merge script
        run: python step2_review_merge.py

      - name: Commit merged files
        run: |
          git config user.name "epr-bot"
          git config user.email "epr-bot@users.noreply.github.com"
          git add master_matrix.csv
          if [ -f rejected_log.csv ]; then
            git add rejected_log.csv
          fi
          git diff --quiet --cached || git commit -m "Step 2 review merge"
          git push
