name: Monthly EPR Data Refresh

on:
  schedule:
    - cron: "0 13 1 * *"   # Runs 1st of every month, 1pm UTC
  workflow_dispatch:        # Lets you also trigger it manually from the Actions tab

permissions:
  contents: write            # Needed so the Action can commit the updated files back

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run refresh script
        run: python monthly_regen_and_digest_v2.py

      - name: Commit updated files
        run: |
          git config user.name "epr-bot"
          git config user.email "epr-bot@users.noreply.github.com"
          git add epr-data.json monthly_digest_email.txt
          git diff --quiet --cached || git commit -m "Monthly EPR data refresh"
          git push
